version: 2

sources:
  - name: raw
    description: Airflow 수집 DAG(ingest__*)이 적재한 API 응답 원본. 레코드 하나가 JSONB 한 행이다.
    schema: raw
    config:
      loaded_at_field: loaded_at
      freshness:   # 수집 DAG은 매일 07:00에 돈다
        warn_after: {count: 36, period: hour}
        error_after: {count: 72, period: hour}
    tables:
      - name: kma_asos_hourly
        description: 기상청 ASOS 시간자료 (dt = 관측일)
      - name: seoul_subway_daily
        description: 서울 지하철 호선별 역별 일별 승하차 (dt = 사용일)
      - name: seoul_bike_rent_daily
        description: 따릉이 대여소별 일별 이용 정보 (dt = 대여일)
